# alive YANG-Push over UDP-Notif replay towards the lab collector.
# Generated by tools/prepare-lab.sh from tools/templates/repro-config.yaml - edit the template, not this file.
# Original capture: 2001:db8:48::1 -> UDP port 10100. Read by traffic-reproducer and by tools/replay-udp-notif.py.
pcap:
  - <integration-repo>/mb-alive-test-result/netgauze/netgauze-yangpush-publisher/ipf-zbl1327-r-daisy-48-yp-udpnotif-20260918-0847-vrf501.pcap

time_factor: 0.05       # 1.0 = real time; 0.05 = 20x faster (tools/run-all.sh overrides it for ebng/titan)
keep_open: false
no_sync: true                    # UDP-Notif does not require minute-boundary synchronisation

# Mandatory section (traffic-reproducer's main.py reads it unconditionally)
optimize:
  threading: false
  preload: false
  network:
    so_sndbuf: null
    so_rcvbuf: null

network:
  map:
    - src_ip: "2001:db8:48::1"
      repro_ip: "::1"         # must match "peer" in the receiver cache subscriptions-info.json
  interface: null

udp_generic:
  select:
    udp:
      dport:
        - 10100                # UDP destination port used in the PCAP
  collector:
    ip: "::1"         # udp_notif listener of the collector (config-lab.yaml)
    port: 8123

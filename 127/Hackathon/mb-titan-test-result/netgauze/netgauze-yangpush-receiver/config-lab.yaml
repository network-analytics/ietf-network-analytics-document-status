# Lab configuration for the netgauze-apache-kafka-integration YANG-Push tests (titan, netgauze).
# Generated by tools/prepare-lab.sh from tools/templates/config-lab.yaml - edit the template, not this file.
#
# PCAP replay -> udp_notif listener -> YANG validation against the pre-populated
# schema cache -> Kafka (YANG-encoded JSON) with the schema registered in the
# Confluent Schema Registry (YANG plugin).

runtime:
  threads: 4

logging:
  # The test procedure greps for TRACE lines
  # ("Found schemaID for the corresponding contentID", "Successfully validated ...")
  level: netgauze_collector=trace,netgauze_yang_push=trace,info
  ansi: false

telemetry:
  url: http://localhost:4317/v1/metrics   # no OTLP collector in the lab; exports fail harmlessly
  id: netgauze-udpnotif-lab
  exporter_timeout: 3000
  reader_interval: 60000
  reader_timeout: 3000

udp_notif:
  subscriber_timeout: 100

  listeners:
    - address: "127.0.0.1:8123"           # the replayer's udp_generic.collector must match
      workers: 2

  # Packets that arrive before the subscription's schema is resolved are cached. A device dumps
  # every subscription in the first seconds of a capture, far more than the defaults (1000/100).
  max_cached_packets_per_peer: 200000
  max_cached_packets_per_subscription: 50000

  # Validate the YANG-Push payload inside the anydata nodes (datastore-contents /
  # datastore-changes) against the subscription schemas (default true).
  anydata_strict_validation: true

  # Receiver cache with the peer remapped to the replay address (10.215.217.123 -> 127.0.0.123),
  # see tools/prepare-lab.sh
  cache_location: <integration-repo>/cache/titan-netgauze

  # Dummy NETCONF block: the key is decoded at startup, so it must be a real key file
  # (/dev/null fails). Nothing listens on the replay IP; fail fast on cache misses.
  netconf:
    username: dummy
    private_key_path: <integration-repo>/lab/dummy_netconf_key
    port: 12345
    max_retries: 0

  publishers:
    yang-lab:
      # udp_notif -> validation -> publisher channels. The publisher blocks for minutes while it
      # registers a device library and the udp_notif actor DROPS when this is full
      # ("channel for subscriber is full").
      buffer_size: 100000
      endpoints:
        yang-endpoint: !TelemetryKafkaYang
          topic: telemetry-message-yang-titan
          schema_registry_url: http://localhost:8081
          producer_config:
            bootstrap.servers: 127.0.0.1:9092
            message.timeout.ms: "60000"
            queue.buffering.max.messages: "1000"
          writer_id: lab-netgauze-yang
          yang_converter:
            subject_prefix: lab
            root_schema_name: ietf-telemetry-message
            default_yang_lib_ref:
              content_id: ietf-telemetry-message-full
              yang_library_path: <netgauze-repo>/assets/yang/ietf-telemetry-message/yang-lib-full.xml
              yang_lib_ref_path: <netgauze-repo>/assets/yang/ietf-telemetry-message/
            extension_yang_lib_ref:
              content_id: ietf-telemetry-message-min
              yang_library_path: <netgauze-repo>/assets/yang/ietf-telemetry-message/yang-lib-min.xml
              yang_lib_ref_path: <netgauze-repo>/assets/yang/ietf-telemetry-message/

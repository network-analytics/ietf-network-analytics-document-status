# titan YANG-Push over UDP-Notif replay towards the lab collector.
# Generated by tools/prepare-lab.sh from tools/templates/repro-config.yaml - edit the template, not this file.
# Original capture: 10.215.217.123 -> UDP port 10101. Read by traffic-reproducer and by tools/replay-udp-notif.py.
pcap:
  - <integration-repo>/mb-titan-test-result/netgauze/netgauze-yangpush-publisher/ipt-age923-b-aac-01-yp-udpnotif-202610261504.pcap

time_factor: 1.0       # 1.0 = real time; 0.05 = 20x faster (per vendor, see tools/vendors.sh)
keep_open: false
no_sync: true                    # UDP-Notif does not require minute-boundary synchronisation

# Mandatory section (traffic-reproducer's main.py reads it unconditionally)
optimize:
  threading: false
  preload: false
  network:
    so_sndbuf: null
    so_rcvbuf: null

network:
  map:
    - src_ip: "10.215.217.123"
      repro_ip: "127.0.0.123"         # must match "peer" in the receiver cache subscriptions-info.json
  interface: null

udp_generic:
  select:
    udp:
      dport:
        - 10101                # UDP destination port used in the PCAP
  collector:
    ip: "127.0.0.1"         # udp_notif listener of the collector (config-lab.yaml)
    port: 8123
